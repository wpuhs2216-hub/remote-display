# 本番: ハジメル側アカウント(eguhaji) https://remote-display.eguhaji.workers.dev
name = "remote-display"
main = "src/worker.js"
compatibility_date = "2026-07-01"
account_id = "37b3e0e33aae125497b47004737095f3"

# 独自ドメイン: カスタムドメイン(DNS+証明書自動)に加え、
# ワイルドカード経路 *.hajimeru.jp/* (テナントサイト用Worker) に奪われないよう明示経路も張る
routes = [
  { pattern = "quiz.hajimeru.jp", custom_domain = true },
  { pattern = "quiz.hajimeru.jp/*", zone_name = "hajimeru.jp" },
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/uploads/*", "/"]

[[kv_namespaces]]
binding = "KV"
id = "8efd09f1d8b4438b9fd2839e81e25722"

# 状態保持用 Durable Object（強整合・WebSocketプッシュ）
[[durable_objects.bindings]]
name = "STATE"
class_name = "StateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StateDO"]
