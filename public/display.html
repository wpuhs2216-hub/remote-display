<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>出力画面 - Remote Display</title>
<link rel="manifest" href="/manifest-display.json">
<link rel="icon" href="/icons/display-192.png">
<link rel="apple-touch-icon" href="/icons/display-192.png">
<meta name="theme-color" content="#ffffff">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #fff; /* 既定: 白地（設定で変更可・JSが適用） */
    color: #000;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  /* 画像+テキスト+注釈を1つのグループとして縦中央に配置（テキストは写真の真下） */
  #stage {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vmin;
  }
  /* 上: 画像エリア（あふれる分だけ縮む） */
  #imageArea {
    flex: 0 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #imageArea img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  /* 写真の真下: メインテキスト（太字・大） */
  #textArea {
    flex: 0 0 auto;
    width: 100%;
    max-height: 45dvh;
    overflow-y: auto;
    padding: 1.5vmin 2vmin 0;
    text-align: center;
    font-size: clamp(40px, 14vmin, 176px);
    font-weight: 700;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* 注釈（小さい赤字・いつでもON/OFF可能） */
  #noteArea {
    flex: 0 0 auto;
    width: 100%;
    padding: 1vmin 2vmin 0;
    text-align: center;
    font-size: clamp(16px, 4vmin, 48px);
    font-weight: 600;
    color: #dc2626;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* 未表示時のデフォルト画面（読み込み中スピナー） */
  #idle {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    color: #aaa;
    font-size: clamp(14px, 2.5vmin, 22px);
  }
  .spinner {
    width: clamp(40px, 8vmin, 72px);
    height: clamp(40px, 8vmin, 72px);
    border: 5px solid rgba(128,128,128,.25);
    border-top-color: #888;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #connState {
    position: fixed;
    top: 10px;
    right: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e33;
    transition: background .3s;
    z-index: 10;
  }
  #connState.ok { background: #2c5; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="connState" title="接続状態"></div>

  <div id="idle">
    <div class="spinner"></div>
    <div>読み込み中…</div>
  </div>

  <div id="stage" class="hidden">
    <div id="imageArea"><img id="image" alt=""></div>
    <div id="textArea"></div>
    <div id="noteArea"></div>
  </div>

<script>
  const idle = document.getElementById('idle');
  const stage = document.getElementById('stage');
  const imageArea = document.getElementById('imageArea');
  const image = document.getElementById('image');
  const textArea = document.getElementById('textArea');
  const noteArea = document.getElementById('noteArea');
  const connState = document.getElementById('connState');

  // 現在の内容と色設定を画面に反映
  function render(state) {
    const current = state.current;
    const s = state.settings || { bg: '#ffffff', fg: '#000000' };
    document.body.style.background = s.bg;
    textArea.style.color = s.fg;

    const noteVisible = current && current.note && current.showNote;
    if (!current || (!current.image && !current.text && !noteVisible)) {
      stage.classList.add('hidden');
      idle.classList.remove('hidden');
      return;
    }
    idle.classList.add('hidden');
    stage.classList.remove('hidden');

    if (current.image) {
      image.src = current.image;
      imageArea.classList.remove('hidden');
    } else {
      image.removeAttribute('src');
      imageArea.classList.add('hidden');
    }

    textArea.textContent = current.text || '';
    textArea.style.maxHeight = current.image ? '45dvh' : 'none';
    textArea.style.display = current.text ? 'block' : 'none';

    noteArea.textContent = noteVisible ? current.note : '';
    noteArea.style.display = noteVisible ? 'block' : 'none';
  }

  // 2秒間隔ポーリング（内容か色設定が変わった時だけ再描画）
  let lastState = null;
  async function poll() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      const data = await res.json();
      connState.classList.add('ok');
      const s = JSON.stringify(data);
      if (s !== lastState) {
        lastState = s;
        render(data);
      }
    } catch (e) {
      connState.classList.remove('ok');
    } finally {
      setTimeout(poll, 2000);
    }
  }
  poll();

  // PWA: Service Worker 登録
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

  // タップでフルスクリーン切替（タブレット掲示用）
  document.body.addEventListener('dblclick', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });
</script>
</body>
</html>
