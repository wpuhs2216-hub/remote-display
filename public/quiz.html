<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>〇〇埋めクイズ</title>
<meta name="theme-color" content="#171a21">
<style>
  :root {
    --bg: #12141a;
    --surface: #1c1f27;
    --surface-2: #262a34;
    --line: #343947;
    --text: #f2f4f8;
    --text-2: #9aa1b0;
    --primary: #3b82f6;
    --live: #22c55e;
    --danger: #ef4444;
    --gold: #fbbf24;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding-bottom: max(48px, env(safe-area-inset-bottom));
  }
  header {
    background: #171a21;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; font-weight: 700; }
  #me { font-size: 13px; color: var(--text-2); text-align: right; line-height: 1.3; }
  #me b { color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 0; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 12px; letter-spacing: .04em; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
  input[type=text], select {
    width: 100%;
    min-height: 52px;
    padding: 12px 14px;
    font-size: 18px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--primary); }
  button {
    -webkit-tap-highlight-color: transparent;
    border: none;
    border-radius: 12px;
    min-height: 54px;
    padding: 12px 18px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    font-family: inherit;
    width: 100%;
    transition: transform .08s ease, filter .08s ease;
  }
  button:active { transform: scale(.97); filter: brightness(.92); }
  button:disabled { opacity: .4; transform: none; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1.5px solid var(--line); min-height: 44px; font-size: 14px; width: auto; padding: 8px 14px; }
  /* 状態バナー */
  .banner {
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 14px;
  }
  .banner.idle { background: var(--surface-2); color: var(--text-2); }
  .banner.open { background: rgba(34,197,94,.15); color: var(--live); border: 1.5px solid var(--live); }
  .banner.closed { background: rgba(251,191,36,.12); color: var(--gold); border: 1.5px solid var(--gold); }
  .banner.revealed { background: rgba(59,130,246,.15); color: #93c5fd; border: 1.5px solid var(--primary); }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  /* 問題表示 */
  #qImage { width: 100%; max-height: 46vh; object-fit: contain; border-radius: 10px; background: #fff; }
  #qText {
    text-align: center;
    font-size: clamp(34px, 11vw, 56px);
    font-weight: 800;
    letter-spacing: .04em;
    padding: 10px 0 4px;
    word-break: break-word;
  }
  .qnum { text-align: center; color: var(--text-2); font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  /* 結果 */
  .result-mark { text-align: center; font-size: 72px; font-weight: 800; line-height: 1.1; }
  .result-mark.ok { color: var(--live); }
  .result-mark.ng { color: var(--danger); }
  .correct-line { text-align: center; font-size: 15px; color: var(--text-2); margin-top: 6px; }
  .correct-line b { font-size: 26px; color: var(--text); display: block; margin-top: 2px; }
  .correct-note { text-align: center; color: var(--danger); font-size: 14px; font-weight: 600; margin-top: 4px; }
  .earn { text-align: center; color: var(--gold); font-weight: 800; font-size: 20px; margin-top: 8px; }
  /* スコアボード */
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .team {
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    border: 1.5px solid var(--line);
    background: var(--surface-2);
  }
  .team .tname { font-size: 13px; font-weight: 700; color: var(--text-2); }
  .team .tpts { font-size: 34px; font-weight: 800; }
  .team.a .tpts { color: #60a5fa; }
  .team.b .tpts { color: #f87171; }
  .team.lead { border-color: var(--gold); }
  .hostrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 1px dashed var(--line);
    font-size: 15px;
  }
  .hostrow:last-child { border-bottom: none; }
  .hostrow .pts { font-weight: 800; font-variant-numeric: tabular-nums; }
  .hostrow .tm { font-size: 11px; color: var(--text-2); margin-right: 6px; }
  .mine { color: var(--gold); }
  #answeredInfo { text-align: center; color: var(--text-2); font-size: 13px; margin-top: 10px; }
  .hidden { display: none !important; }
  #toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #fff;
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 15px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 1000;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <header>
    <h1>🎯 〇〇埋めクイズ</h1>
    <div id="me" class="hidden"><b id="meName"></b><br>担当: <span id="meHost"></span></div>
  </header>

  <main>
    <!-- 参加登録 -->
    <div class="card" id="setupCard">
      <h2>参加登録</h2>
      <label>ニックネーム</label>
      <input type="text" id="nameInput" placeholder="例: ゆうこ" maxlength="20" autocomplete="off">
      <label>あなたの担当</label>
      <select id="hostSel"></select>
      <button class="btn-primary" id="joinBtn">参加する</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game" class="hidden">
      <div class="banner idle" id="banner">まもなく次の問題！</div>

      <div class="card hidden" id="questionCard">
        <div class="qnum" id="qnum"></div>
        <img id="qImage" alt="">
        <div id="qText"></div>
        <div id="answerArea">
          <label>あなたの回答（ひらがなでOK）</label>
          <input type="text" id="answerInput" placeholder="例: たまねぎ" maxlength="50" autocomplete="off">
          <button class="btn-primary" id="answerBtn">回答する</button>
          <div id="answeredInfo" class="hidden"></div>
        </div>
      </div>

      <div class="card hidden" id="resultCard">
        <div class="result-mark" id="resultMark"></div>
        <div class="correct-line">正解は…<b id="correctText"></b></div>
        <div class="correct-note" id="correctNote"></div>
        <div class="earn hidden" id="earn"></div>
      </div>

      <div class="card" id="scoreCard">
        <h2>スコアボード</h2>
        <div class="teams" id="teams"></div>
        <div id="hostScores"></div>
      </div>

      <button class="btn-ghost" id="editProfile">名前・担当を変更</button>
    </div>
  </main>

  <div id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let quiz = null;
  let lastQnum = 0;
  let myAnswerFor = 0; // 回答済みの問題番号

  // プレイヤーID（この端末に固定）
  let playerId = localStorage.getItem('quizPlayerId');
  if (!playerId) {
    playerId = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('quizPlayerId', playerId);
  }

  const myName = () => localStorage.getItem('quizName') || '';
  const myHost = () => localStorage.getItem('quizHost') || '';

  let toastTimer;
  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function renderSetup() {
    const sel = $('hostSel');
    sel.innerHTML = '<option value="">担当を選んでください</option>';
    if (quiz) {
      for (const h of quiz.hosts) {
        const o = document.createElement('option');
        o.value = h.name;
        o.textContent = `${h.name}（${quiz.teamNames[h.team] || h.team}）`;
        sel.appendChild(o);
      }
    }
    if (myHost()) sel.value = myHost();
    $('nameInput').value = myName();
  }

  $('joinBtn').onclick = () => {
    const name = $('nameInput').value.trim();
    const host = $('hostSel').value;
    if (!name) return showToast('ニックネームを入力してください');
    if (!host && quiz && quiz.hosts.length) return showToast('担当を選んでください');
    localStorage.setItem('quizName', name);
    localStorage.setItem('quizHost', host);
    render();
    showToast('参加しました！');
  };
  $('editProfile').onclick = () => {
    localStorage.removeItem('quizName');
    render();
  };

  async function submitAnswer() {
    const a = $('answerInput').value.trim();
    if (!a) return showToast('回答を入力してください');
    $('answerBtn').disabled = true;
    try {
      const res = await fetch('/api/quiz/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId, name: myName(), host: myHost(), answer: a }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'error');
      myAnswerFor = quiz.qnum;
      localStorage.setItem('quizMyAnswer', JSON.stringify({ qnum: quiz.qnum, answer: a }));
      showToast('回答を送信しました！');
      render();
    } catch (e) {
      showToast('送信失敗: ' + e.message);
    }
    $('answerBtn').disabled = false;
  }
  $('answerBtn').onclick = submitAnswer;
  $('answerInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAnswer(); });

  function savedAnswer() {
    try {
      const s = JSON.parse(localStorage.getItem('quizMyAnswer') || 'null');
      return (s && quiz && s.qnum === quiz.qnum) ? s.answer : null;
    } catch { return null; }
  }

  function renderScores() {
    if (!quiz) return;
    const totals = { A: 0, B: 0 };
    for (const h of quiz.hosts) totals[h.team] += quiz.scores[h.name] || 0;
    const lead = totals.A === totals.B ? '' : (totals.A > totals.B ? 'A' : 'B');
    $('teams').innerHTML = ['A', 'B'].map((t) =>
      `<div class="team ${t.toLowerCase()} ${lead === t ? 'lead' : ''}">
        <div class="tname">${quiz.teamNames[t] || t}${lead === t ? ' 👑' : ''}</div>
        <div class="tpts">${totals[t]}<small style="font-size:14px">P</small></div>
      </div>`).join('');
    const rows = [...quiz.hosts]
      .map((h) => ({ ...h, pts: quiz.scores[h.name] || 0 }))
      .sort((a, b) => b.pts - a.pts);
    $('hostScores').innerHTML = rows.map((h) =>
      `<div class="hostrow ${h.name === myHost() ? 'mine' : ''}">
        <span><span class="tm">${quiz.teamNames[h.team] || h.team}</span>${h.name}${h.name === myHost() ? ' ★' : ''}</span>
        <span class="pts">${h.pts}P</span>
      </div>`).join('') || '<div style="color:var(--text-2);font-size:14px;text-align:center;padding:8px 0">担当が未設定です</div>';
  }

  function render() {
    const joined = !!myName();
    $('setupCard').classList.toggle('hidden', joined);
    $('game').classList.toggle('hidden', !joined);
    $('me').classList.toggle('hidden', !joined);
    if (!joined) { renderSetup(); return; }
    $('meName').textContent = myName();
    $('meHost').textContent = myHost() || '未選択';
    if (!quiz) return;

    const banner = $('banner');
    const qc = $('questionCard');
    const rc = $('resultCard');
    banner.className = 'banner ' + quiz.state;

    if (quiz.state === 'idle' || !quiz.question) {
      banner.textContent = 'まもなく次の問題！画面のまま少々お待ちください';
      banner.classList.add('pulse');
      qc.classList.add('hidden');
      rc.classList.add('hidden');
    } else {
      banner.classList.remove('pulse');
      qc.classList.remove('hidden');
      $('qnum').textContent = `第${quiz.qnum}問`;
      if (quiz.question.image) { $('qImage').src = quiz.question.image; $('qImage').style.display = 'block'; }
      else $('qImage').style.display = 'none';
      $('qText').textContent = quiz.question.text || '';

      const mine = savedAnswer();
      if (quiz.state === 'open') {
        banner.textContent = '🟢 回答受付中！';
        $('answerArea').classList.remove('hidden');
        rc.classList.add('hidden');
        $('answerBtn').textContent = mine ? '回答を修正する' : '回答する';
        $('answeredInfo').classList.toggle('hidden', !mine);
        if (mine) $('answeredInfo').textContent = `回答済み: 「${mine}」（締切まで修正できます）`;
      } else if (quiz.state === 'closed') {
        banner.textContent = '🔒 回答締切！結果発表をお待ちください';
        $('answerArea').classList.add('hidden');
        rc.classList.add('hidden');
      } else if (quiz.state === 'revealed') {
        banner.textContent = '🎉 結果発表！';
        $('answerArea').classList.add('hidden');
        rc.classList.remove('hidden');
        $('correctText').textContent = quiz.correct || '';
        $('correctNote').textContent = quiz.note ? `※${quiz.note}` : '';
        const r = quiz.results && quiz.results[playerId];
        const mark = $('resultMark');
        const earn = $('earn');
        if (!r) {
          mark.textContent = '−';
          mark.className = 'result-mark';
          earn.classList.add('hidden');
          $('correctNote').insertAdjacentHTML('afterend', '');
        } else if (r.ok) {
          mark.textContent = '⭕ 正解！';
          mark.className = 'result-mark ok';
          earn.textContent = `担当 ${r.host} に +${quiz.points}P！`;
          earn.classList.remove('hidden');
        } else {
          mark.textContent = `❌「${r.answer}」`;
          mark.className = 'result-mark ng';
          earn.classList.add('hidden');
        }
      }
    }
    renderScores();
  }

  function apply(data) {
    if (!data.quiz) return;
    const prev = quiz;
    quiz = data.quiz;
    // 新しい問題が始まったら入力欄をリセット
    if (!prev || prev.qnum !== quiz.qnum || (prev.state !== 'open' && quiz.state === 'open')) {
      if (!savedAnswer()) $('answerInput').value = '';
    }
    render();
  }

  // WebSocket + ポーリングフォールバック
  let wsOk = false;
  function connectWS() {
    let ws;
    try {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
    } catch (e) { setTimeout(connectWS, 5000); return; }
    ws.onopen = () => { wsOk = true; };
    ws.onmessage = (ev) => apply(JSON.parse(ev.data));
    ws.onclose = () => { wsOk = false; setTimeout(connectWS, 3000); };
    ws.onerror = () => ws.close();
  }
  async function poll() {
    if (!wsOk) {
      try {
        const res = await fetch('/api/quiz/state', { cache: 'no-store' });
        apply(await res.json());
      } catch (e) {}
    }
    setTimeout(poll, wsOk ? 15000 : 2500);
  }
  connectWS();
  poll();
  render();
</script>
</body>
</html>
