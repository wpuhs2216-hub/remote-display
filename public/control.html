<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作画面 - Remote Display</title>
<link rel="manifest" href="/manifest-control.json">
<link rel="icon" href="/icons/control-192.png">
<link rel="apple-touch-icon" href="/icons/control-192.png">
<meta name="theme-color" content="#1a1d24">
<style>
  /* ---- デザイントークン（8px リズム / セマンティックカラー） ---- */
  :root {
    --bg: #eef0f4;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --line: #e3e6eb;
    --text: #1b1f27;
    --text-2: #6b7280;
    --primary: #2563eb;
    --primary-soft: #eff4ff;
    --live: #16a34a;
    --live-soft: #ecfdf3;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --radius: 14px;
    --radius-s: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding-bottom: max(48px, env(safe-area-inset-bottom));
  }
  /* ---- ヘッダー ---- */
  header {
    background: #171a21;
    color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .01em; }
  a.display-link {
    display: inline-block;
    color: #9ec2ff;
    font-size: 13px;
    text-decoration: none;
    padding: 4px 0;
  }
  header .actions { display: flex; gap: 8px; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 12px 0; }
  /* ---- カード / セクション ---- */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
  }
  .card h2 {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-2);
    letter-spacing: .02em;
    margin-bottom: 12px;
  }
  /* ---- フォーム ---- */
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
  input[type=file] { width: 100%; font-size: 14px; margin-bottom: 12px; padding: 8px 0; }
  select, input[type=text] {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    font-size: 16px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-s);
    margin-bottom: 12px;
    background: var(--surface);
    font-family: inherit;
    color: var(--text);
  }
  textarea {
    width: 100%;
    min-height: 72px;
    padding: 10px 12px;
    font-size: 16px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-s);
    margin-bottom: 12px;
    font-family: inherit;
    color: var(--text);
  }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  /* ---- ボタン共通（44px 以上・押下フィードバック） ---- */
  button {
    -webkit-tap-highlight-color: transparent;
    border: none;
    border-radius: var(--radius-s);
    min-height: 44px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    font-family: inherit;
    transition: transform .08s ease, filter .08s ease;
  }
  button:active { transform: scale(.97); filter: brightness(.94); }
  button:disabled { opacity: .35; cursor: default; transform: none; filter: none; }
  .btn-primary { background: var(--primary); color: #fff; width: 100%; min-height: 52px; font-size: 16px; }
  .btn-edit { background: var(--surface-2); color: var(--text); border: 1.5px solid var(--line); }
  .btn-del { background: var(--danger-soft); color: var(--danger); }
  .btn-clear { background: #3a4150; color: #fff; font-size: 14px; padding: 8px 14px; }
  .btn-clear.on { background: var(--primary); }
  #preview {
    max-width: 100%;
    max-height: 200px;
    border-radius: var(--radius-s);
    margin-bottom: 12px;
    display: none;
  }
  /* ---- フォルダタブ（横スクロール・44px） ---- */
  #folderBar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 -16px 12px;
    padding: 2px 16px 6px;
  }
  #folderBar::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    background: var(--surface-2);
    color: var(--text);
    border: 1.5px solid var(--line);
    min-height: 44px;
    padding: 8px 18px;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
  }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  /* ---- プリセットカード ---- */
  .preset {
    padding: 12px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    margin-bottom: 12px;
  }
  .preset.active { border: 2px solid var(--live); background: var(--live-soft); }
  .preset.tappable { cursor: pointer; }
  .preset.tappable:active { background: var(--surface-2); }
  .preset .top { display: flex; gap: 12px; align-items: flex-start; }
  .preset .thumb {
    width: 88px;
    height: 88px;
    flex: 0 0 88px;
    object-fit: cover;
    border-radius: var(--radius-s);
    background: #e4e7ec;
    border: 1px solid var(--line);
  }
  .preset .thumb.noimg {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9aa1ac;
    font-size: 11px;
  }
  .preset .body { flex: 1; min-width: 0; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    background: var(--live);
    color: #fff;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .note-line {
    font-size: 13px;
    font-weight: 600;
    color: var(--danger);
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 2px;
  }
  /* ---- テキスト候補行（選択式ボタン風・48px） ---- */
  .text-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 48px;
    padding: 10px 12px;
    border-radius: var(--radius-s);
    border: 1.5px solid var(--line);
    background: var(--surface);
    margin-bottom: 8px;
  }
  body:not(.edit) .text-row { cursor: pointer; }
  body:not(.edit) .text-row:active { background: var(--surface-2); }
  /* 選択インジケータ（○ / ✓）で状態を色以外でも伝える */
  body:not(.edit) .text-row::before {
    content: '';
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #c6ccd6;
    background: var(--surface);
  }
  body:not(.edit) .text-row.on::before {
    content: '✓';
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    border-color: var(--live);
    background: var(--live);
  }
  .text-row.on { background: var(--live-soft); border-color: var(--live); }
  .text-row .txt {
    flex: 1;
    min-width: 0;
    font-size: 17px;
    font-weight: 600;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .text-row .mini {
    min-height: 40px;
    padding: 6px 12px;
    font-size: 13px;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    color: var(--text);
    flex: 0 0 auto;
  }
  .text-row .mini.del { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
  .preset .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .preset .btns button { padding: 8px 14px; font-size: 14px; }
  .color-row { display: flex; gap: 20px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .color-row label { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text); }
  .color-row input[type=color] { width: 56px; height: 44px; border: 1.5px solid var(--line); border-radius: var(--radius-s); padding: 3px; background: var(--surface); }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin: 4px 0 4px; font-size: 15px; min-height: 44px; }
  .toggle-row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--primary); }
  /* ---- 編集モード ---- */
  .edit-only { display: none; }
  body.edit .edit-only { display: block; }
  body.edit .preset { background: var(--surface); }
  /* 新規登録のテキスト候補ペア */
  .pair {
    border: 1.5px solid var(--line);
    background: var(--surface-2);
    border-radius: var(--radius-s);
    padding: 12px;
    padding-right: 48px;
    margin-bottom: 10px;
    position: relative;
  }
  .pair textarea { min-height: 48px; margin-bottom: 8px; background: var(--surface); }
  .pair input[type=text] { margin-bottom: 0; background: var(--surface); }
  .pair .pair-del {
    position: absolute;
    top: 8px;
    right: 8px;
    min-height: 36px;
    padding: 4px 10px;
    font-size: 14px;
    background: var(--danger-soft);
    color: var(--danger);
  }
  #empty { color: var(--text-2); font-size: 15px; text-align: center; padding: 24px 0; }
  /* ---- トースト ---- */
  #toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: #171a21;
    color: #fff;
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 15px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 1000;
  }
  #toast.show { opacity: 1; }
  /* ---- ライブプレビュー ---- */
  #miniPreview {
    border-radius: var(--radius-s);
    border: 1px solid var(--line);
    padding: 12px;
    text-align: center;
  }
  #miniPreview img {
    max-width: 100%;
    max-height: 160px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    border-radius: 6px;
  }
  #miniPreview .pv-text {
    font-weight: 700;
    font-size: 20px;
    line-height: 1.35;
    margin-top: 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #miniPreview .pv-note {
    font-weight: 600;
    font-size: 13px;
    color: var(--danger);
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #miniPreview .pv-idle { color: var(--text-2); font-size: 14px; padding: 16px 0; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>📡 リモート表示 操作画面</h1>
      <a class="display-link" href="/display" target="_blank">出力画面を開く →</a>
    </div>
    <div class="actions">
      <button class="btn-clear" id="editBtn">✏️ 編集</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>📺 現在の出力（ライブプレビュー）</h2>
      <div id="miniPreview"></div>
    </div>

    <div class="card">
      <h2 id="listTitle">タップで出力を切り替え</h2>
      <div id="folderBar"></div>
      <div id="presetList"></div>
      <div id="empty">まだ登録がありません</div>
    </div>

    <div class="card edit-only">
      <h2>新規登録</h2>
      <form id="addForm">
        <label>画像（上に表示）</label>
        <input type="file" id="imageInput" name="image" accept="image/*">
        <img id="preview" alt="プレビュー">
        <label>メインテキスト候補（複数登録可・それぞれに注釈を付けられる）</label>
        <div id="textPairs"></div>
        <button type="button" id="addPairBtn" class="btn-edit" style="margin-bottom:12px">＋テキスト候補を追加</button>
        <label>フォルダ</label>
        <select id="folderSel"></select>
        <input type="text" id="folderInput" placeholder="新しいフォルダ名を入力" style="display:none">
        <button type="submit" class="btn-primary">登録する</button>
      </form>
    </div>

    <div class="card edit-only">
      <h2>🎨 表示・保存の設定</h2>
      <div class="color-row">
        <label>背景色 <input type="color" id="bgColor" value="#ffffff"></label>
        <label>文字色 <input type="color" id="fgColor" value="#000000"></label>
      </div>
      <label>🎬 保存サイズ（動画素材用PNG）</label>
      <select id="sizeSel">
        <option value="1920x1080">横 1920×1080（16:9）</option>
        <option value="1080x1920">縦 1080×1920（9:16）</option>
        <option value="1080x1080">正方形 1080×1080</option>
        <option value="1500x2100-nowrap">縦 1500×2100（5:7・改行なし）</option>
      </select>
    </div>

    <div class="card edit-only">
      <h2>⚙ 設定：合言葉の変更</h2>
      <label>新しい合言葉（4〜64文字）</label>
      <input type="text" id="newKeyInput" placeholder="新しい合言葉を入力" autocomplete="off">
      <button id="changeKeyBtn" class="btn-primary" style="background:#7c3aed">合言葉を変更する</button>
    </div>
  </main>

  <div id="toast"></div>

<script>
  const addForm = document.getElementById('addForm');
  const imageInput = document.getElementById('imageInput');
  const textPairs = document.getElementById('textPairs');
  const folderSel = document.getElementById('folderSel');
  const folderInput = document.getElementById('folderInput');
  const preview = document.getElementById('preview');
  const presetList = document.getElementById('presetList');
  const empty = document.getElementById('empty');
  const toast = document.getElementById('toast');
  const bgColor = document.getElementById('bgColor');
  const fgColor = document.getElementById('fgColor');
  const editBtn = document.getElementById('editBtn');

  let presets = [];
  let current = null;
  let settings = { bg: '#ffffff', fg: '#000000' };
  let editMode = false;
  let folderFilter = localStorage.getItem('folderFilter') || '__all__';
  const selectedText = {}; // presetId -> 選択中テキスト候補のindex
  const noteSel = {};      // presetId -> 注釈を出力に含めるか
  let toastTimer;

  // 合言葉は初回のみ入力（この端末に記憶し、2回目以降はスキップ）
  if (!localStorage.getItem('adminKey')) {
    const k = prompt('操作用の合言葉を入力してください（初回のみ）');
    if (k !== null) localStorage.setItem('adminKey', k.trim());
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // 編集モード切替
  editBtn.addEventListener('click', () => {
    editMode = !editMode;
    document.body.classList.toggle('edit', editMode);
    editBtn.textContent = editMode ? '✅ 完了' : '✏️ 編集';
    editBtn.classList.toggle('on', editMode);
    document.getElementById('listTitle').textContent = editMode ? '編集モード（登録内容の編集・並び替え）' : 'タップで出力を切り替え';
    renderList();
  });

  // 新規登録: テキスト候補ペア（テキスト+注釈）の追加・削除
  function addPair(focus) {
    const wrap = document.createElement('div');
    wrap.className = 'pair';
    const ta = document.createElement('textarea');
    ta.className = 'pair-t';
    ta.placeholder = `テキスト候補 ${textPairs.children.length + 1}（例: 〇ん〇〇う）`;
    const ni = document.createElement('input');
    ni.type = 'text';
    ni.className = 'pair-n';
    ni.placeholder = '注釈（小さい赤字・任意）';
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'pair-del';
    del.textContent = '✕';
    del.onclick = () => {
      if (textPairs.children.length > 1) wrap.remove();
      else { ta.value = ''; ni.value = ''; }
    };
    wrap.append(del, ta, ni);
    textPairs.appendChild(wrap);
    if (focus) ta.focus();
  }
  addPair();
  document.getElementById('addPairBtn').addEventListener('click', () => addPair(true));

  // フォルダ選択肢を既存フォルダから生成（新規作成も可能）
  function renderFolderOptions() {
    const prev = folderSel.value;
    folderSel.innerHTML = '';
    const opts = [['', '（未分類）'], ...folderNames().map((f) => [f, '📁 ' + f]), ['__new__', '＋ 新しいフォルダを作る…']];
    for (const [val, label] of opts) {
      const o = document.createElement('option');
      o.value = val;
      o.textContent = label;
      folderSel.appendChild(o);
    }
    // 絞り込み中のフォルダを初期選択に
    const def = prev && opts.some((x) => x[0] === prev) ? prev
      : (folderFilter !== '__all__' && folderFilter !== '' && folderNames().includes(folderFilter)) ? folderFilter : '';
    folderSel.value = def;
    folderInput.style.display = folderSel.value === '__new__' ? 'block' : 'none';
  }
  folderSel.addEventListener('change', () => {
    folderInput.style.display = folderSel.value === '__new__' ? 'block' : 'none';
    if (folderSel.value === '__new__') folderInput.focus();
  });

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }
  });

  const isActive = (p) => {
    if (!current) return false;
    if (p.image) return current.image === p.image;
    return !current.image && p.texts.some((x) => x.t === current.text);
  };

  // 現在の出力のプチプレビュー
  function renderPreview() {
    const box = document.getElementById('miniPreview');
    box.style.background = settings.bg;
    box.innerHTML = '';
    if (!current || (!current.image && !current.text && !(current.note && current.showNote))) {
      const idle = document.createElement('div');
      idle.className = 'pv-idle';
      idle.textContent = 'デフォルト画面（何も表示していません）';
      box.appendChild(idle);
      return;
    }
    if (current.image) {
      const img = document.createElement('img');
      img.src = current.image;
      box.appendChild(img);
    }
    if (current.text) {
      const t = document.createElement('div');
      t.className = 'pv-text';
      t.style.color = settings.fg;
      t.textContent = current.text;
      box.appendChild(t);
    }
    if (current.note && current.showNote) {
      const n = document.createElement('div');
      n.className = 'pv-note';
      n.textContent = current.note;
      box.appendChild(n);
    }
  }

  // 表示中のプリセットは、表示中のテキスト・注釈状態を選択初期値に同期する
  function syncSelectionToCurrent() {
    if (!current) return;
    for (const p of presets) {
      if (current.image !== p.image) continue;
      const idx = p.texts.findIndex((x) => x.t === current.text);
      if (idx >= 0) {
        selectedText[p.id] = idx;
        if (p.texts[idx].note) noteSel[p.id] = !!current.showNote;
      }
    }
  }

  // フォルダ一覧（登録データから導出）
  function folderNames() {
    return [...new Set(presets.map((p) => p.folder || '').filter(Boolean))];
  }

  function visiblePresets() {
    if (folderFilter === '__all__') return presets;
    if (folderFilter === '') return presets.filter((p) => !(p.folder || ''));
    return presets.filter((p) => (p.folder || '') === folderFilter);
  }

  function renderFolderBar() {
    const bar = document.getElementById('folderBar');
    bar.innerHTML = '';
    const folders = folderNames();
    const chips = [['__all__', 'すべて'], ...folders.map((f) => [f, '📁 ' + f])];
    if (folders.length && presets.some((p) => !(p.folder || ''))) chips.push(['', '未分類']);
    if (!chips.some((c) => c[0] === folderFilter)) folderFilter = '__all__';
    if (folders.length === 0) return; // フォルダ未使用ならタブ非表示
    for (const [val, label] of chips) {
      const b = document.createElement('button');
      b.className = 'chip' + (folderFilter === val ? ' on' : '');
      b.textContent = label;
      b.onclick = () => {
        folderFilter = val;
        localStorage.setItem('folderFilter', val);
        renderFolderBar();
        renderList();
      };
      bar.appendChild(b);
    }
  }

  // タップで即出力切替
  async function tapShow(p, textIndex) {
    const entry = textIndex >= 0 ? p.texts[textIndex] : null;
    if (textIndex >= 0) selectedText[p.id] = textIndex;
    const showNote = entry && entry.note ? (noteSel[p.id] !== false) : false;
    // 表示中と同じ内容なら何もしない
    if (current && current.image === p.image && (current.text || '') === (entry ? entry.t : '') &&
        (!entry || !entry.note || !!current.showNote === showNote)) return;
    await api('/api/show', { method: 'POST', body: JSON.stringify({ presetId: p.id, textIndex, showNote }), headers: { 'Content-Type': 'application/json' } });
    showToast('出力を切り替えました');
    await refresh();
  }

  function renderList() {
    renderFolderBar();
    presetList.innerHTML = '';
    const visible = visiblePresets();
    empty.style.display = visible.length ? 'none' : 'block';

    // デフォルト画面（何も表示しない）に戻すカード
    const defCard = document.createElement('div');
    defCard.className = 'preset' + (current ? ' tappable' : ' active');
    const defTop = document.createElement('div');
    defTop.className = 'top';
    const defThumb = Object.assign(document.createElement('div'), { className: 'thumb noimg', textContent: '🔄' });
    defThumb.style.fontSize = '28px';
    const defBody = document.createElement('div');
    defBody.className = 'body';
    if (!current) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '● 表示中';
      defBody.appendChild(badge);
    }
    const defTxt = document.createElement('div');
    defTxt.style.fontSize = '14px';
    defTxt.style.padding = '8px 0';
    defTxt.textContent = current ? 'デフォルト画面に戻す（タップ）' : 'デフォルト画面';
    defBody.appendChild(defTxt);
    if (current && !editMode) {
      defCard.onclick = async () => {
        await api('/api/clear', { method: 'POST' });
        showToast('デフォルト画面に戻しました');
        await refresh();
      };
    }
    defTop.append(defThumb, defBody);
    defCard.appendChild(defTop);
    presetList.appendChild(defCard);

    visible.forEach((p, vi) => {
      if (!(p.id in selectedText)) selectedText[p.id] = 0;
      if (!(p.id in noteSel)) noteSel[p.id] = true;
      const active = isActive(p);
      const div = document.createElement('div');
      div.className = 'preset' + (active ? ' active' : '');

      const top = document.createElement('div');
      top.className = 'top';
      const thumb = p.image
        ? Object.assign(document.createElement('img'), { className: 'thumb', src: p.image })
        : Object.assign(document.createElement('div'), { className: 'thumb noimg', textContent: '画像なし' });

      const body = document.createElement('div');
      body.className = 'body';
      if (active) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '● 表示中';
        body.appendChild(badge);
      }
      if (p.folder && folderFilter === '__all__') {
        const f = document.createElement('div');
        f.style.cssText = 'font-size:11px;color:#888;margin-bottom:4px';
        f.textContent = '📁 ' + p.folder;
        body.appendChild(f);
      }

      // 画像のみ（テキストなし）のプリセットは行がないのでサムネタップで出力
      if (!editMode && !p.texts.length) {
        div.classList.add('tappable');
        div.onclick = () => tapShow(p, -1);
      }

      // テキスト候補（通常モード: タップで即出力 / 編集モード: 編集ボタン表示）
      p.texts.forEach((x, i) => {
        const row = document.createElement('div');
        const rowShown = active && current.text === x.t;
        row.className = 'text-row' + (rowShown ? ' on' : '');
        const txtWrap = document.createElement('div');
        txtWrap.className = 'txt';
        const txt = document.createElement('div');
        txt.textContent = (rowShown ? '● ' : '') + x.t;
        if (rowShown) txt.style.fontWeight = '700';
        txtWrap.appendChild(txt);
        if (x.note) {
          const noteDiv = document.createElement('div');
          noteDiv.className = 'note-line';
          noteDiv.textContent = '注: ' + x.note;
          txtWrap.appendChild(noteDiv);
        }
        row.appendChild(txtWrap);

        if (editMode) {
          const edit = document.createElement('button');
          edit.className = 'mini';
          edit.textContent = '✎';
          edit.onclick = async () => {
            const v = prompt('テキストを編集', x.t);
            if (v === null || !v.trim()) return;
            const texts = p.texts.map((y, j) => j === i ? { ...y, t: v.trim() } : y);
            await putPreset(p.id, { textsJson: JSON.stringify(texts) });
          };
          const noteBtn = document.createElement('button');
          noteBtn.className = 'mini';
          noteBtn.textContent = '注';
          noteBtn.style.color = '#dc2626';
          noteBtn.onclick = async () => {
            const v = prompt('このテキストの注釈（小さい赤字・空で削除）', x.note || '');
            if (v === null) return;
            const texts = p.texts.map((y, j) => j === i ? { ...y, note: v.trim() } : y);
            await putPreset(p.id, { textsJson: JSON.stringify(texts) });
          };
          const del = document.createElement('button');
          del.className = 'mini del';
          del.textContent = '✕';
          del.onclick = async () => {
            if (!confirm('このテキスト候補を削除しますか？')) return;
            const texts = p.texts.filter((_, j) => j !== i);
            await putPreset(p.id, { textsJson: JSON.stringify(texts) });
          };
          row.append(edit, noteBtn, del);
        } else {
          row.onclick = () => tapShow(p, i);
        }
        body.appendChild(row);
      });

      // 注釈ありのテキストがある場合、出力に含めるかのチェック（通常モードのみ）
      const selEntry = p.texts[selectedText[p.id] || 0];
      const shownEntry = active ? p.texts.find((x) => x.t === current.text) : null;
      const noteEntry = shownEntry || selEntry;
      if (!editMode && noteEntry && noteEntry.note) {
        const toggleRow = document.createElement('label');
        toggleRow.className = 'note-line';
        toggleRow.style.cssText = 'display:flex;align-items:center;gap:6px;margin-top:8px';
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = active && shownEntry ? !!current.showNote : noteSel[p.id] !== false;
        chk.onclick = (e) => e.stopPropagation();
        chk.onchange = async () => {
          noteSel[p.id] = chk.checked;
          // 表示中の注釈はその場でON/OFF反映
          if (active && shownEntry && shownEntry.note) {
            await api('/api/note', { method: 'POST', body: JSON.stringify({ showNote: chk.checked }), headers: { 'Content-Type': 'application/json' } });
            await refresh();
          }
        };
        const span = document.createElement('span');
        span.textContent = '注釈も出力する';
        toggleRow.append(chk, span);
        body.appendChild(toggleRow);
      }

      // 編集モードの操作ボタン群
      if (editMode) {
        const btns = document.createElement('div');
        btns.className = 'btns';

        const addTextBtn = document.createElement('button');
        addTextBtn.className = 'btn-edit';
        addTextBtn.textContent = '＋テキスト';
        addTextBtn.onclick = async () => {
          const v = prompt('追加するテキスト');
          if (!v || !v.trim()) return;
          await putPreset(p.id, { textsJson: JSON.stringify([...p.texts, { t: v.trim(), note: '' }]) });
        };

        const folderBtn = document.createElement('button');
        folderBtn.className = 'btn-edit';
        folderBtn.textContent = '📁移動';
        folderBtn.onclick = async () => {
          const names = folderNames();
          const v = prompt('フォルダ名（空で未分類に戻す）' + (names.length ? '\n既存: ' + names.join(' / ') : ''), p.folder || '');
          if (v === null) return;
          await putPreset(p.id, { folder: v.trim() });
        };

        const imageBtn = document.createElement('button');
        imageBtn.className = 'btn-edit';
        imageBtn.textContent = '📷画像';
        imageBtn.onclick = () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.onchange = async () => {
            const file = input.files[0];
            if (!file) return;
            await putPreset(p.id, { image: file });
          };
          input.click();
        };

        const upBtn = document.createElement('button');
        upBtn.className = 'btn-edit';
        upBtn.textContent = '↑';
        upBtn.disabled = vi === 0;
        upBtn.onclick = () => movePreset(p, visible, vi, -1);

        const downBtn = document.createElement('button');
        downBtn.className = 'btn-edit';
        downBtn.textContent = '↓';
        downBtn.disabled = vi === visible.length - 1;
        downBtn.onclick = () => movePreset(p, visible, vi, 1);

        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn-edit';
        saveBtn.textContent = '🎬保存';
        saveBtn.onclick = () => exportPreset(p).catch((e) => showToast('保存失敗: ' + e.message));

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del';
        delBtn.textContent = '削除';
        delBtn.onclick = async () => {
          if (!confirm('この登録を削除しますか？')) return;
          await api(`/api/presets/${p.id}`, { method: 'DELETE' });
          showToast('削除しました');
          await refresh();
        };

        btns.append(addTextBtn, folderBtn, imageBtn, upBtn, downBtn, saveBtn, delBtn);
        body.appendChild(btns);
      }

      top.append(thumb, body);
      div.appendChild(top);
      presetList.appendChild(div);
    });
  }

  // 表示中フォルダ内で1つ上/下と入れ替え（全体順序に反映して保存）
  async function movePreset(p, visible, vi, delta) {
    const other = visible[vi + delta];
    if (!other) return;
    const ids = presets.map((x) => x.id);
    const a = ids.indexOf(p.id);
    const b = ids.indexOf(other.id);
    [ids[a], ids[b]] = [ids[b], ids[a]];
    await api('/api/reorder', { method: 'POST', body: JSON.stringify({ ids }), headers: { 'Content-Type': 'application/json' } });
    await refresh();
  }

  // 書き込み系APIは合言葉ヘッダ付きで送る（401なら入力を促して1回だけ再試行）
  async function api(url, opts, retried) {
    const options = opts ? { ...opts } : undefined;
    if (options) {
      options.headers = { ...(options.headers || {}), 'X-Admin-Key': localStorage.getItem('adminKey') || '' };
    }
    const res = await fetch(url, options);
    if (res.status === 401 && options && !retried) {
      const key = prompt('操作用の合言葉を入力してください');
      if (key !== null) {
        localStorage.setItem('adminKey', key);
        return api(url, opts, true);
      }
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast('エラー: ' + (err.error || res.status));
      throw new Error(err.error || res.status);
    }
    return res.json();
  }

  async function putPreset(id, fields) {
    const fd = new FormData();
    for (const [k, v] of Object.entries(fields)) fd.append(k, v);
    await api(`/api/presets/${id}`, { method: 'PUT', body: fd });
    showToast('更新しました');
    await refresh();
  }

  async function refresh() {
    const [p, s] = await Promise.all([api('/api/presets'), api('/api/state')]);
    presets = p.presets;
    current = s.current;
    settings = s.settings || settings;
    bgColor.value = settings.bg;
    fgColor.value = settings.fg;
    syncSelectionToCurrent();
    renderPreview();
    renderList();
    renderFolderOptions();
  }

  // WebSocketで出力状態の変化を受けてプレビューとリストを即時更新
  function connectWS() {
    let ws;
    try {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
    } catch (e) { return; }
    ws.onmessage = (ev) => {
      const data = JSON.parse(ev.data);
      current = data.current;
      settings = data.settings || settings;
      syncSelectionToCurrent();
      renderPreview();
      renderList();
    };
    ws.onclose = () => setTimeout(connectWS, 5000);
    ws.onerror = () => ws.close();
  }
  connectWS();

  // 出力画面と同じレイアウト（上:画像 / 下:太字テキスト / 注釈）を1枚のPNGに合成して保存
  async function exportPreset(p) {
    const sizeVal = document.getElementById('sizeSel').value;
    const noWrap = sizeVal.endsWith('-nowrap'); // メインテキストを改行せず1行に収める
    const [W, H] = sizeVal.replace('-nowrap', '').split('x').map(Number);
    const entry = p.texts.length ? (p.texts[selectedText[p.id] || 0] || null) : null;
    const text = entry ? entry.t : '';
    const note = (entry && entry.note && noteSel[p.id] !== false) ? entry.note : '';
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = settings.bg;
    ctx.fillRect(0, 0, W, H);

    const vmin = Math.min(W, H);
    const family = '"Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif';

    const wrap = (str, fontPx) => {
      ctx.font = `700 ${fontPx}px ${family}`;
      const maxW = W * 0.92;
      const lines = [];
      for (const para of str.split('\n')) {
        let cur = '';
        for (const ch of para) {
          if (cur && ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
          else cur += ch;
        }
        lines.push(cur);
      }
      return lines;
    };

    let mainSize = Math.round(vmin * 0.14); // 出力画面の 14vmin 相当
    if (noWrap && text) {
      ctx.font = `700 ${mainSize}px ${family}`;
      const w = ctx.measureText(text).width;
      if (w > W * 0.92) mainSize = Math.floor(mainSize * (W * 0.92) / w);
    }
    const mainLineH = Math.round(mainSize * 1.4);
    let mainLines = text ? (noWrap ? [text] : wrap(text, mainSize)) : [];
    if (p.image && mainLines.length) {
      const maxLines = Math.max(1, Math.floor((H * 0.45) / mainLineH));
      if (mainLines.length > maxLines) {
        mainLines = mainLines.slice(0, maxLines);
        mainLines[maxLines - 1] = mainLines[maxLines - 1].slice(0, -1) + '…';
      }
    }
    const noteSize = Math.round(vmin * 0.07); // 出力画面の 7vmin 相当
    const noteLineH = Math.round(noteSize * 1.4);
    const noteLines = note ? wrap(note, noteSize) : [];

    const gap = vmin * 0.02;
    const pad = vmin * 0.02;
    const mainH = mainLines.length ? mainLines.length * mainLineH : 0;
    const noteH = noteLines.length ? noteLines.length * noteLineH : 0;

    let img = null, dw = 0, dh = 0;
    if (p.image) {
      img = new Image();
      img.src = p.image;
      await img.decode();
      const areaW = W - pad * 2;
      const areaH = H - pad * 2 - (mainH ? mainH + gap : 0) - (noteH ? noteH + gap : 0);
      const s = Math.min(areaW / img.width, areaH / img.height);
      dw = img.width * s;
      dh = img.height * s;
    }
    const contentH = dh + (mainH ? (dh ? gap : 0) + mainH : 0) + (noteH ? gap + noteH : 0);
    let cursorY = (H - contentH) / 2;

    if (img) {
      ctx.drawImage(img, (W - dw) / 2, cursorY, dw, dh);
      cursorY += dh;
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (mainLines.length) {
      if (img) cursorY += gap;
      ctx.fillStyle = settings.fg;
      ctx.font = `700 ${mainSize}px ${family}`;
      mainLines.forEach((ln, i) => ctx.fillText(ln, W / 2, cursorY + mainLineH * (i + 0.5)));
      cursorY += mainH;
    }
    if (noteLines.length) {
      cursorY += gap;
      ctx.fillStyle = '#dc2626';
      ctx.font = `600 ${noteSize}px ${family}`;
      noteLines.forEach((ln, i) => ctx.fillText(ln, W / 2, cursorY + noteLineH * (i + 0.5)));
    }

    const a = document.createElement('a');
    a.download = `display-${(text || note || 'image').replace(/[\\/:*?"<>|\s]/g, '_').slice(0, 12)}-${W}x${H}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    showToast('PNGを保存しました');
  }

  // 背景色・文字色の変更（選択したら即保存 → 出力側にも即反映）
  async function saveColors() {
    const res = await api('/api/settings', { method: 'POST', body: JSON.stringify({ bg: bgColor.value, fg: fgColor.value }), headers: { 'Content-Type': 'application/json' } });
    settings = res.settings;
    renderPreview();
    showToast('色設定を保存しました');
  }
  bgColor.addEventListener('change', saveColors);
  fgColor.addEventListener('change', saveColors);

  // 合言葉の変更
  document.getElementById('changeKeyBtn').addEventListener('click', async () => {
    const newKey = document.getElementById('newKeyInput').value.trim();
    if (newKey.length < 4) { showToast('合言葉は4文字以上にしてください'); return; }
    if (!confirm('合言葉を変更しますか？他の操作端末では新しい合言葉の再入力が必要になります')) return;
    await api('/api/admin-key', { method: 'POST', body: JSON.stringify({ newKey }), headers: { 'Content-Type': 'application/json' } });
    localStorage.setItem('adminKey', newKey);
    document.getElementById('newKeyInput').value = '';
    showToast('合言葉を変更しました');
  });

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pairs = [...textPairs.querySelectorAll('.pair')]
      .map((w) => ({ t: w.querySelector('.pair-t').value.trim(), note: w.querySelector('.pair-n').value.trim() }))
      .filter((x) => x.t);
    if (!imageInput.files[0] && !pairs.length) {
      showToast('画像かテキストを入力してください');
      return;
    }
    const fd = new FormData();
    if (imageInput.files[0]) fd.append('image', imageInput.files[0]);
    fd.append('textsJson', JSON.stringify(pairs));
    const folder = folderSel.value === '__new__' ? folderInput.value.trim() : folderSel.value;
    fd.append('folder', folder);
    await api('/api/presets', { method: 'POST', body: fd });
    addForm.reset();
    textPairs.innerHTML = '';
    addPair();
    preview.style.display = 'none';
    showToast('登録しました');
    await refresh();
  });

  refresh();

  // PWA: Service Worker 登録
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
