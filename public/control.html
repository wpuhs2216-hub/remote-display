<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作画面 - Remote Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f5f7;
    color: #222;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    padding-bottom: 40px;
  }
  header {
    background: #1a1d24;
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; font-weight: 700; }
  header .actions { display: flex; gap: 8px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 { font-size: 14px; color: #666; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #444; margin-bottom: 6px; }
  input[type=file] { width: 100%; font-size: 14px; margin-bottom: 12px; }
  select, input[type=text] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 12px;
    background: #fff;
    font-family: inherit;
  }
  textarea {
    width: 100%;
    min-height: 72px;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 12px;
    font-family: inherit;
  }
  button {
    -webkit-tap-highlight-color: transparent;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-primary { background: #2563eb; color: #fff; width: 100%; padding: 12px; font-size: 16px; }
  .btn-show { background: #16a34a; color: #fff; }
  .btn-edit { background: #e5e7eb; color: #333; }
  .btn-del { background: #fee2e2; color: #b91c1c; }
  .btn-clear { background: #444; color: #fff; font-size: 13px; padding: 8px 12px; }
  #preview {
    max-width: 100%;
    max-height: 180px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: none;
  }
  .preset {
    padding: 12px;
    border: 2px solid transparent;
    border-radius: 10px;
    background: #fafafa;
    margin-bottom: 10px;
  }
  .preset.active { border-color: #16a34a; background: #f0fdf4; }
  .preset .top { display: flex; gap: 12px; align-items: flex-start; }
  .preset .thumb {
    width: 72px;
    height: 72px;
    flex: 0 0 72px;
    object-fit: cover;
    border-radius: 8px;
    background: #ddd;
  }
  .preset .thumb.noimg {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 11px;
  }
  .preset .body { flex: 1; min-width: 0; }
  .badge {
    display: inline-block;
    font-size: 11px;
    color: #16a34a;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .note-line {
    font-size: 12px;
    font-weight: 600;
    color: #dc2626;
    margin-bottom: 6px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .text-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px dashed #e5e7eb;
  }
  .text-row input[type=radio] { width: 18px; height: 18px; flex: 0 0 18px; }
  .text-row .txt {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .text-row .mini {
    padding: 6px 8px;
    font-size: 12px;
    background: #e5e7eb;
    color: #333;
    flex: 0 0 auto;
  }
  .text-row .mini.del { background: #fee2e2; color: #b91c1c; }
  .preset .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .preset .btns button { padding: 8px 12px; font-size: 13px; }
  .color-row { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .color-row label { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .color-row input[type=color] { width: 48px; height: 36px; border: 1px solid #ccc; border-radius: 6px; padding: 2px; background: #fff; }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; }
  .toggle-row input[type=checkbox] { width: 20px; height: 20px; }
  #empty { color: #999; font-size: 14px; text-align: center; padding: 12px 0; }
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1d24;
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 20;
  }
  #toast.show { opacity: 1; }
  a.display-link { color: #93c5fd; font-size: 12px; text-decoration: none; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>📡 リモート表示 操作画面</h1>
      <a class="display-link" href="/display" target="_blank">出力画面を開く →</a>
    </div>
    <div class="actions">
      <button class="btn-clear" id="clearBtn">表示クリア</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>新規登録</h2>
      <form id="addForm">
        <label>画像（上に表示）</label>
        <input type="file" id="imageInput" name="image" accept="image/*">
        <img id="preview" alt="プレビュー">
        <label>メインテキスト（下に太字で表示・後から追加可能）</label>
        <textarea id="textInput" placeholder="表示するテキストを入力"></textarea>
        <label>注釈（小さい赤字・任意）</label>
        <input type="text" id="noteInput" placeholder="例: ※スタッフが美味しくいただきました">
        <button type="submit" class="btn-primary">登録する</button>
      </form>
    </div>

    <div class="card">
      <h2>🎨 表示・保存の設定</h2>
      <div class="color-row">
        <label>背景色 <input type="color" id="bgColor" value="#ffffff"></label>
        <label>文字色 <input type="color" id="fgColor" value="#000000"></label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="noteToggle" checked>
        <label for="noteToggle" style="margin:0">注釈を表示する（表示中いつでも切替・保存にも反映）</label>
      </div>
      <label>🎬 保存サイズ（動画素材用PNG）</label>
      <select id="sizeSel">
        <option value="1920x1080">横 1920×1080（16:9）</option>
        <option value="1080x1920">縦 1080×1920（9:16）</option>
        <option value="1080x1080">正方形 1080×1080</option>
      </select>
    </div>

    <div class="card">
      <h2>登録済みリスト（テキストを選んで「表示」→ 出力側に反映）</h2>
      <div id="presetList"></div>
      <div id="empty">まだ登録がありません</div>
    </div>

    <div class="card">
      <h2>⚙ 設定：合言葉の変更</h2>
      <label>新しい合言葉（4〜64文字）</label>
      <input type="text" id="newKeyInput" placeholder="新しい合言葉を入力" autocomplete="off">
      <button id="changeKeyBtn" class="btn-primary" style="background:#7c3aed">合言葉を変更する</button>
    </div>
  </main>

  <div id="toast"></div>

<script>
  const addForm = document.getElementById('addForm');
  const imageInput = document.getElementById('imageInput');
  const textInput = document.getElementById('textInput');
  const noteInput = document.getElementById('noteInput');
  const preview = document.getElementById('preview');
  const presetList = document.getElementById('presetList');
  const empty = document.getElementById('empty');
  const toast = document.getElementById('toast');
  const bgColor = document.getElementById('bgColor');
  const fgColor = document.getElementById('fgColor');
  const noteToggle = document.getElementById('noteToggle');

  let presets = [];
  let current = null;
  let settings = { bg: '#ffffff', fg: '#000000' };
  const selectedText = {}; // presetId -> 選択中テキスト候補のindex
  let toastTimer;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // 選択画像のプレビュー
  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }
  });

  const isActive = (p) => {
    if (!current) return false;
    if (p.image) return current.image === p.image;
    return !current.image && p.texts.includes(current.text);
  };

  function renderList() {
    presetList.innerHTML = '';
    empty.style.display = presets.length ? 'none' : 'block';
    for (const p of presets) {
      if (!(p.id in selectedText)) selectedText[p.id] = 0;
      const div = document.createElement('div');
      div.className = 'preset' + (isActive(p) ? ' active' : '');

      const top = document.createElement('div');
      top.className = 'top';
      const thumb = p.image
        ? Object.assign(document.createElement('img'), { className: 'thumb', src: p.image })
        : Object.assign(document.createElement('div'), { className: 'thumb noimg', textContent: '画像なし' });

      const body = document.createElement('div');
      body.className = 'body';
      if (isActive(p)) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '● 表示中';
        body.appendChild(badge);
      }
      if (p.note) {
        const noteLine = document.createElement('div');
        noteLine.className = 'note-line';
        noteLine.textContent = '注釈: ' + p.note;
        body.appendChild(noteLine);
      }

      // テキスト候補（ラジオで1つだけ選択 = 太字系は同時に1つ）
      p.texts.forEach((t, i) => {
        const row = document.createElement('div');
        row.className = 'text-row';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'sel-' + p.id;
        radio.checked = selectedText[p.id] === i;
        radio.onchange = () => { selectedText[p.id] = i; };
        const txt = document.createElement('span');
        txt.className = 'txt';
        txt.textContent = t;
        const edit = document.createElement('button');
        edit.className = 'mini';
        edit.textContent = '✎';
        edit.onclick = async () => {
          const v = prompt('テキストを編集', t);
          if (v === null) return;
          const texts = [...p.texts];
          texts[i] = v.trim();
          await putPreset(p.id, { textsJson: JSON.stringify(texts.filter(Boolean)) });
        };
        const del = document.createElement('button');
        del.className = 'mini del';
        del.textContent = '✕';
        del.onclick = async () => {
          if (!confirm('このテキスト候補を削除しますか？')) return;
          const texts = p.texts.filter((_, j) => j !== i);
          await putPreset(p.id, { textsJson: JSON.stringify(texts) });
        };
        row.append(radio, txt, edit, del);
        body.appendChild(row);
      });

      const btns = document.createElement('div');
      btns.className = 'btns';

      const showBtn = document.createElement('button');
      showBtn.className = 'btn-show';
      showBtn.textContent = '表示';
      showBtn.onclick = async () => {
        const textIndex = p.texts.length ? selectedText[p.id] : -1;
        await api('/api/show', { method: 'POST', body: JSON.stringify({ presetId: p.id, textIndex }), headers: { 'Content-Type': 'application/json' } });
        showToast('出力側に表示しました');
        await refresh();
      };

      const addTextBtn = document.createElement('button');
      addTextBtn.className = 'btn-edit';
      addTextBtn.textContent = '＋テキスト';
      addTextBtn.onclick = async () => {
        const v = prompt('追加するテキスト');
        if (!v || !v.trim()) return;
        await putPreset(p.id, { textsJson: JSON.stringify([...p.texts, v.trim()]) });
      };

      const noteBtn = document.createElement('button');
      noteBtn.className = 'btn-edit';
      noteBtn.textContent = '注釈✎';
      noteBtn.onclick = async () => {
        const v = prompt('注釈（小さい赤字・空で削除）', p.note || '');
        if (v === null) return;
        await putPreset(p.id, { note: v.trim() });
      };

      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn-edit';
      saveBtn.textContent = '🎬保存';
      saveBtn.onclick = () => exportPreset(p).catch((e) => showToast('保存失敗: ' + e.message));

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-del';
      delBtn.textContent = '削除';
      delBtn.onclick = async () => {
        if (!confirm('この登録を削除しますか？')) return;
        await api(`/api/presets/${p.id}`, { method: 'DELETE' });
        showToast('削除しました');
        await refresh();
      };

      btns.append(showBtn, addTextBtn, noteBtn, saveBtn, delBtn);
      body.appendChild(btns);
      top.append(thumb, body);
      div.appendChild(top);
      presetList.appendChild(div);
    }
  }

  // 書き込み系APIは合言葉ヘッダ付きで送る（401なら入力を促して1回だけ再試行）
  async function api(url, opts, retried) {
    const options = opts ? { ...opts } : undefined;
    if (options) {
      options.headers = { ...(options.headers || {}), 'X-Admin-Key': localStorage.getItem('adminKey') || '' };
    }
    const res = await fetch(url, options);
    if (res.status === 401 && options && !retried) {
      const key = prompt('操作用の合言葉を入力してください');
      if (key !== null) {
        localStorage.setItem('adminKey', key);
        return api(url, opts, true);
      }
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast('エラー: ' + (err.error || res.status));
      throw new Error(err.error || res.status);
    }
    return res.json();
  }

  async function putPreset(id, fields) {
    const fd = new FormData();
    for (const [k, v] of Object.entries(fields)) fd.append(k, v);
    await api(`/api/presets/${id}`, { method: 'PUT', body: fd });
    showToast('更新しました');
    await refresh();
  }

  async function refresh() {
    const [p, s] = await Promise.all([api('/api/presets'), api('/api/state')]);
    presets = p.presets;
    current = s.current;
    settings = s.settings || settings;
    bgColor.value = settings.bg;
    fgColor.value = settings.fg;
    if (current) noteToggle.checked = !!current.showNote;
    renderList();
  }

  // 出力画面と同じレイアウト（上:画像 / 下:太字テキスト / 注釈）を1枚のPNGに合成して保存
  async function exportPreset(p) {
    const [W, H] = document.getElementById('sizeSel').value.split('x').map(Number);
    const text = p.texts.length ? p.texts[selectedText[p.id] || 0] : '';
    const note = noteToggle.checked ? (p.note || '') : '';
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = settings.bg;
    ctx.fillRect(0, 0, W, H);

    const vmin = Math.min(W, H);
    const family = '"Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif';

    // 折り返し計算（フォントサイズ毎）
    const wrap = (str, fontPx) => {
      ctx.font = `700 ${fontPx}px ${family}`;
      const maxW = W * 0.92;
      const lines = [];
      for (const para of str.split('\n')) {
        let cur = '';
        for (const ch of para) {
          if (cur && ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
          else cur += ch;
        }
        lines.push(cur);
      }
      return lines;
    };

    const mainSize = Math.round(vmin * 0.14); // 出力画面の 14vmin 相当
    const mainLineH = Math.round(mainSize * 1.4);
    let mainLines = text ? wrap(text, mainSize) : [];
    if (p.image && mainLines.length) {
      const maxLines = Math.max(1, Math.floor((H * 0.45) / mainLineH));
      if (mainLines.length > maxLines) {
        mainLines = mainLines.slice(0, maxLines);
        mainLines[maxLines - 1] = mainLines[maxLines - 1].slice(0, -1) + '…';
      }
    }
    const noteSize = Math.round(vmin * 0.04); // 注釈は小さめ
    const noteLineH = Math.round(noteSize * 1.4);
    const noteLines = note ? wrap(note, noteSize) : [];

    const gap = vmin * 0.02;
    const pad = vmin * 0.02;
    const mainH = mainLines.length ? mainLines.length * mainLineH : 0;
    const noteH = noteLines.length ? noteLines.length * noteLineH : 0;

    // 画像サイズを先に決め、画像+テキスト+注釈のグループ全体を縦中央に配置（テキストは写真の真下）
    let img = null, dw = 0, dh = 0;
    if (p.image) {
      img = new Image();
      img.src = p.image;
      await img.decode();
      const areaW = W - pad * 2;
      const areaH = H - pad * 2 - (mainH ? mainH + gap : 0) - (noteH ? noteH + gap : 0);
      const s = Math.min(areaW / img.width, areaH / img.height);
      dw = img.width * s;
      dh = img.height * s;
    }
    const contentH = dh + (mainH ? (dh ? gap : 0) + mainH : 0) + (noteH ? gap + noteH : 0);
    let cursorY = (H - contentH) / 2;

    if (img) {
      ctx.drawImage(img, (W - dw) / 2, cursorY, dw, dh);
      cursorY += dh;
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (mainLines.length) {
      if (img) cursorY += gap;
      ctx.fillStyle = settings.fg;
      ctx.font = `700 ${mainSize}px ${family}`;
      mainLines.forEach((ln, i) => ctx.fillText(ln, W / 2, cursorY + mainLineH * (i + 0.5)));
      cursorY += mainH;
    }
    if (noteLines.length) {
      cursorY += gap;
      ctx.fillStyle = '#dc2626';
      ctx.font = `600 ${noteSize}px ${family}`;
      noteLines.forEach((ln, i) => ctx.fillText(ln, W / 2, cursorY + noteLineH * (i + 0.5)));
    }

    const a = document.createElement('a');
    a.download = `display-${(text || note || 'image').replace(/[\\/:*?"<>|\s]/g, '_').slice(0, 12)}-${W}x${H}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    showToast('PNGを保存しました');
  }

  // 背景色・文字色の変更（選択したら即保存 → 出力側にも数秒で反映）
  async function saveColors() {
    const res = await api('/api/settings', { method: 'POST', body: JSON.stringify({ bg: bgColor.value, fg: fgColor.value }), headers: { 'Content-Type': 'application/json' } });
    settings = res.settings;
    showToast('色設定を保存しました');
  }
  bgColor.addEventListener('change', saveColors);
  fgColor.addEventListener('change', saveColors);

  // 注釈の表示ON/OFF（表示中いつでも切替）
  noteToggle.addEventListener('change', async () => {
    await api('/api/note', { method: 'POST', body: JSON.stringify({ showNote: noteToggle.checked }), headers: { 'Content-Type': 'application/json' } });
    showToast(noteToggle.checked ? '注釈を表示します' : '注釈を非表示にしました');
    await refresh();
  });

  // 合言葉の変更
  document.getElementById('changeKeyBtn').addEventListener('click', async () => {
    const newKey = document.getElementById('newKeyInput').value.trim();
    if (newKey.length < 4) { showToast('合言葉は4文字以上にしてください'); return; }
    if (!confirm('合言葉を変更しますか？他の操作端末では新しい合言葉の再入力が必要になります')) return;
    await api('/api/admin-key', { method: 'POST', body: JSON.stringify({ newKey }), headers: { 'Content-Type': 'application/json' } });
    localStorage.setItem('adminKey', newKey);
    document.getElementById('newKeyInput').value = '';
    showToast('合言葉を変更しました');
  });

  document.getElementById('clearBtn').addEventListener('click', async () => {
    await api('/api/clear', { method: 'POST' });
    showToast('表示をクリアしました');
    await refresh();
  });

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!imageInput.files[0] && !textInput.value.trim()) {
      showToast('画像かテキストを入力してください');
      return;
    }
    const fd = new FormData();
    if (imageInput.files[0]) fd.append('image', imageInput.files[0]);
    fd.append('text', textInput.value);
    fd.append('note', noteInput.value);
    await api('/api/presets', { method: 'POST', body: fd });
    addForm.reset();
    preview.style.display = 'none';
    showToast('登録しました');
    await refresh();
  });

  refresh();
</script>
</body>
</html>
